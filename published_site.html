<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><script src='https://cdn.tailwindcss.com'></script><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap' rel='stylesheet'><style>body{font-family: 'Cairo', sans-serif;}</style></head><body class='bg-zinc-950 text-zinc-100 min-h-screen'><header class='border-b border-zinc-800 p-6 flex justify-between items-center'><h1 class='text-2xl font-bold'>أريج الشرق</h1><nav><button onclick='alert("جاري العمل على القائمة")' class='px-4 py-2 border border-zinc-700 rounded-xl hover:bg-zinc-800'>سلة المشتريات</button></nav></header><main class='p-8'><section class='grid grid-cols-1 md:grid-cols-3 gap-6'><div class='bg-zinc-900 p-6 rounded-2xl border border-zinc-800'><h3 class='text-lg'>عطر العود الملكي</h3><p class='text-zinc-400 mt-2'>450 ر.س</p><button onclick='checkout()' class='mt-4 w-full bg-amber-600 py-2 rounded-lg font-bold'>شراء الآن</button></div></section></main><div id='toast' class='hidden fixed bottom-5 right-5 bg-emerald-600 px-6 py-3 rounded-full'>تمت عملية الدفع بنجاح!</div><script>function checkout(){document.getElementById('toast').classList.remove('hidden');window.parent.postMessage({ type: 'PAYMENT_COMPLETED', txId: 'TX-123456', item: { title: 'عطر العود الملكي' } }, '*');setTimeout(()=>document.getElementById('toast').classList.add('hidden'), 3000);}</script></body></html>
